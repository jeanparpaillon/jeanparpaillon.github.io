# Filter buttons on the Work page (/portfolio/).
#
# Rendered by layouts/projects/list.html in file order, after the built-in
# "All" button (which is not listed here). Each entry may carry any of
# `roles`, `tags` and `domains`; a project matches the filter as soon as one
# of its front matter values appears in one of those lists -- the lists are
# OR'ed together, and matching is exact and case-sensitive.
#
#   - name: Open Source
#     domains:
#       - Open Source
#     tags:
#       - Open Source
- id: architecture
  i18n: portfolio_architecture
  roles:
    - Architect

- id: techlead
  i18n: portfolio_techlead
  roles:
    - Technical Lead

- id: distributed
  i18n: portfolio_distributed
  tags:
    - Distributed Systems

- id: opensource
  i18n: portfolio_opensource
  domains:
    - Open Source
  tags:
    - Open Source

- id: innovation
  i18n: portfolio_innovation
  tags:
    - AI
    - Innovation

baseURL: https://parpaillon.info/
locale: en
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
title: "Jean Parpaillon"
enableEmoji: true
enableRobotsTXT: true

# Sections used for search index, archives and "recent" listings.
mainSections: ["portfolio"]

permalinks:
  portfolio: /portfolio/:slug/
  services: /services/:slug/

pagination:
  pagerSize: 12
  path: "page"

# Portfolio filtering (see README.md)
taxonomies:
  tag: tags
  role: roles
  domain: domains

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      strikethrough: true
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false
    noClasses: false
    style: github
    tabWidth: 2

outputs:
  home: ["HTML", "RSS", "JSON", "WebAppManifest"]

outputFormats:
  WebAppManifest:
    mediaType: "application/manifest+json"
    baseName: "site"
    isPlainText: true

module:
  hugoVersion:
    extended: true
    min: "0.165.0"
  imports:
    - path: github.com/tom2almighty/hugo-narrow

  # --- English-only content, served in every language ---------------------
  # Portfolio projects and recommendations are written in English only and are
  # not going to be translated. Mounting those directories a second time for
  # fr/it makes the very same files build as French and Italian pages, so each
  # language gets a complete section instead of an empty one. The chrome around
  # them (title, filters, nav, cards) still translates normally.
  mounts:
    - source: content
      target: content

    # Portfolio: the section page IS translated (_index.fr.md / _index.it.md),
    # so exclude _index.* here and let the default mount above provide it.
    - source: content/portfolio
      target: content/portfolio
      files:
        - '! _index.*'
      sites:
        matrix:
          languages: ['fr', 'it']

    # Recommendations: headless section, quotes stay in their original language.
    # _index.md is mounted too -- it carries the `build.render: never` cascade
    # that keeps these out of the published pages, and has no translation.
    - source: content/recommendations
      target: content/recommendations
      sites:
        matrix:
          languages: ['fr', 'it']

build:
  noJSConfigInAssets: true

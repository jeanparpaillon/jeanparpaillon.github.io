{{/* Closing call to action -- copy comes from params.yaml `contactCta`. */}}
{{ $cta := site.Params.contactCta }}
{{ with $cta }}
  <section class="mb-6">
    <div class="bg-primary/10 border-primary/30 rounded-xl border p-6 text-center shadow-sm">
      <h2 class="text-foreground mb-2 text-2xl font-bold">{{ .title }}</h2>
      {{ with .description }}
        <p class="text-muted-foreground mb-6 leading-relaxed">{{ . }}</p>
      {{ end }}
      {{ with .action }}
        <a
          href="{{ .url | relLangURL }}"
          class="bg-primary text-primary-foreground hover:bg-primary/90 inline-flex items-center gap-2 rounded-xl px-6 py-3 font-medium shadow-sm transition-all duration-300 ease-out hover:-translate-y-1 focus:outline-none"
        >
          <span>{{ .name }}</span>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
